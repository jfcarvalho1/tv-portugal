<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV e Rádios">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0f12">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>TV e Rádios</title>
<style>
  :root { color-scheme: dark; --fundo:#0e0f12; --cartao:#1b1d23; --cartao2:#262932; --texto:#f2f2f4; --fraco:#9a9ca3; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px -apple-system, system-ui, sans-serif; }
  button, input { font-family: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(14,15,18,.94);
           backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
           padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; }
  h1 { font-size: 26px; margin: 4px 0 10px; }
  .abas { display: flex; gap: 6px; background: var(--cartao); border-radius: 12px; padding: 4px; }
  .abas button { flex: 1; border: 0; background: none; color: var(--fraco); font-weight: 600; font-size: 15px; padding: 9px 0; border-radius: 9px; }
  .abas button.activa { background: var(--cartao2); color: var(--texto); }
  input[type=search] { width: 100%; margin-top: 10px; border: 0; border-radius: 11px; padding: 11px 14px;
                       background: var(--cartao); color: var(--texto); font-size: 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 20px; padding: 8px 14px; background: var(--cartao); color: var(--texto); font-size: 15px; white-space: nowrap; }
  .chip.activo { background: var(--texto); color: #000; font-weight: 600; }
  main { padding: 6px 12px calc(env(safe-area-inset-bottom) + 110px); }
  .grupo { color: var(--fraco); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 18px 6px 8px; }
  .linha { display: flex; align-items: center; gap: 12px; padding: 9px 8px; border-radius: 12px; }
  .linha:active { background: var(--cartao); }
  .logo { flex: none; width: 46px; height: 46px; border-radius: 10px; background: #fff center/contain no-repeat;
          display: grid; place-items: center; color: #000; font-weight: 700; font-size: 15px; overflow: hidden; }
  .logo.sem { background: var(--cartao2); color: var(--texto); }
  .nome { flex: 1; min-width: 0; }
  .nome b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nome small { color: var(--fraco); }
  .fav { border: 0; background: none; font-size: 22px; padding: 6px; color: #555; }
  .fav.sim { color: #f5c542; }
  .vazio { color: var(--fraco); text-align: center; padding: 50px 20px; line-height: 1.5; }
  #tv { display: none; position: fixed; inset: 0; z-index: 20; background: #000; flex-direction: column; }
  #tv.aberto { display: flex; }
  #tv .topo { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; }
  #tv .topo b { flex: 1; font-size: 17px; }
  #tvGuia { padding: 0 14px 8px; color: var(--fraco); font-size: 14px; line-height: 1.5; }
  #tvGuia b { color: var(--texto); font-weight: 600; }
  #tv button { border: 0; background: var(--cartao2); color: #fff; border-radius: 10px; padding: 9px 13px; font-size: 15px; }
  #tv video { flex: 1; width: 100%; min-height: 0; background: #000; }
  #tv .zap { display: flex; gap: 10px; padding: 10px 12px calc(env(safe-area-inset-bottom) + 12px); }
  #tv .zap button { flex: 1; padding: 14px; font-size: 17px; }
  #barra { display: none; position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px);
           z-index: 10; background: var(--cartao2); border-radius: 16px; padding: 10px 12px;
           align-items: center; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #barra.visivel { display: flex; }
  #barra .nome small { display: block; }
  #barra button { border: 0; background: var(--texto); color: #000; width: 46px; height: 46px; border-radius: 50%; font-size: 19px; flex: none; }
  #barra button.parar { background: none; color: var(--fraco); width: 36px; }
  #aviso { display: none; position: fixed; left: 16px; right: 16px; top: 38%; z-index: 30; background: var(--cartao2);
           border-radius: 16px; padding: 18px; text-align: center; line-height: 1.45; box-shadow: 0 10px 40px #000; }
  #aviso.visivel { display: block; }
  #aviso a, #aviso button { display: inline-block; margin: 12px 6px 0; padding: 10px 16px; border-radius: 10px; border: 0;
                            background: var(--texto); color: #000; text-decoration: none; font-weight: 600; font-size: 15px; }
  #aviso button { background: var(--cartao); color: var(--texto); }
</style>
</head>
<body>
<header>
  <h1>TV e Rádios</h1>
  <div class="abas">
    <button data-aba="tv" class="activa">📺 TV</button>
    <button data-aba="radio">📻 Rádios</button>
    <button data-aba="fav">⭐ Favoritos</button>
  </div>
  <input type="search" id="procura" placeholder="Procurar canal ou rádio" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>
<main id="lista"><div class="vazio">A carregar…</div></main>

<div id="tv">
  <div class="topo"><button id="fecharTv">✕ Fechar</button><b id="tvNome"></b></div>
  <div id="tvGuia"></div>
  <video id="video" playsinline controls autoplay referrerpolicy="no-referrer"></video>
  <div class="zap"><button id="ant">◀︎ Anterior</button><button id="seg">Seguinte ▶︎</button></div>
</div>

<div id="barra">
  <div class="logo sem" id="barraLogo"></div>
  <div class="nome"><b id="barraNome"></b><small id="barraEstado"></small></div>
  <button id="tocar">⏸</button>
  <button class="parar" id="parar">✕</button>
</div>
<audio id="audio" preload="none"></audio>

<div id="aviso"><div id="avisoTexto"></div><div id="avisoBotoes"></div></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script>
<script>
"use strict";
const RAW = "https://raw.githubusercontent.com/jfcarvalho1/tv-portugal/main/listas/";
const PAISES = [["portugal","🇵🇹 Portugal"],["espanha","🇪🇸 Espanha"],["franca","🇫🇷 França"],["italia","🇮🇹 Itália"],
  ["holanda","🇳🇱 Holanda"],["belgica","🇧🇪 Bélgica"],["alemanha","🇩🇪 Alemanha"],["brasil","🇧🇷 Brasil"],
  ["eua","🇺🇸 EUA"],["internacional","🌍 Internacional"],["resto-do-mundo","🗺️ Resto do mundo"]];

const $ = s => document.querySelector(s);
const estado = { aba: "tv", pais: "portugal", regiao: "Todas", procura: "", tv: {}, radios: null, aTocar: null, listaVisivel: [] };

// favoritos e último país ficam guardados só neste iPhone
function ler(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let favoritos = ler("favoritos", []);
let falhados = ler("falhados", {});            // id -> data em que falhou
const TRES_DIAS = 3 * 24 * 3600 * 1000;
for (const k in falhados) if (Date.now() - falhados[k] > TRES_DIAS) delete falhados[k];
function marcarFalha(c) { falhados[c.id] = Date.now(); gravar("falhados", falhados); }
function marcarBom(c) { if (falhados[c.id]) { delete falhados[c.id]; gravar("falhados", falhados); } }
estado.pais = ler("pais", "portugal");

function lerM3U(texto, tipo) {
  const canais = []; let atual = null;
  for (const bruta of texto.split(/\r?\n/)) {
    const l = bruta.trim();
    if (l.startsWith("#EXTINF")) {
      const at = {}; l.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { at[k] = v; });
      atual = { nome: l.slice(l.lastIndexOf(",") + 1).trim(), logo: at["tvg-logo"] || "", grupo: at["group-title"] || "", tipo,
                tid: (at["tvg-id"] || "").trim().toLowerCase() };
    } else if (l.startsWith("#EXTVLCOPT:") && atual) {
      const m = l.match(/^#EXTVLCOPT:http-(referrer|origin|user-agent)=\"?([^"]*)\"?$/);
      if (m) { atual.cab = atual.cab || {}; atual.cab[{ referrer: "r", origin: "o", "user-agent": "a" }[m[1]]] = m[2].trim(); }
    } else if (l && !l.startsWith("#") && atual) {
      atual.url = l; atual.id = tipo + "|" + l; canais.push(atual); atual = null;
    }
  }
  return canais;
}
async function buscar(nome, tipo) {
  const r = await fetch(RAW + nome + "?h=" + Math.floor(Date.now() / 3600000), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return lerM3U(await r.text(), tipo);
}
async function tvDoPais(p) {
  if (!estado.tv[p]) { estado.tv[p] = await buscar("tv/" + p + ".m3u", "tv"); estado.tv[p].forEach(c => { c.pais = p; }); }
  await guiaDoPais(p);
  return estado.tv[p];
}
// ---------- guia de programação (o que está a dar agora e a seguir)
const guias = {};
function chaveNome(n) {
  return semAcentos((n || "").replace(/\(.*?\)|\[.*?\]/g, "")).replace(/[^a-z0-9]/g, "").replace(/(fhd|uhd|hd|sd|4k)$/, "");
}
async function guiaDoPais(p) {
  if (!(p in guias)) {
    guias[p] = null;
    try {
      const r = await fetch(RAW + "epg/" + p + ".json?h=" + Math.floor(Date.now() / 1800000), { cache: "no-store" });
      guias[p] = r.ok ? (await r.json()).c : {};
    } catch (e) { guias[p] = {}; }
  }
  return guias[p] || {};
}
function programas(c) {
  const g = guias[c.pais]; if (!g) return null;
  const lst = g[c.tid || ("n:" + chaveNome(c.nome))]; if (!lst) return null;
  const m = Date.now() / 60000;
  const i = lst.findIndex(p => p[0] <= m && p[1] > m);
  return i < 0 ? null : { agora: lst[i], seguinte: lst[i + 1] };
}
const hm = min => new Date(min * 60000).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
async function radios() { if (!estado.radios) estado.radios = await buscar("radios.m3u", "radio"); return estado.radios; }

const semAcentos = t => (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function iniciais(n) { return n.replace(/^r[áa]dio\s+/i, "").split(/\s+/).slice(0, 2).map(p => p[0] || "").join("").toUpperCase(); }
function nomeGrupo(g) { return (g || "").replace(/^Rádios Locais - /, "").replace(/^Rádios /, ""); }

function chips(lista, activo, aoEscolher) {
  const c = $("#chips"); c.innerHTML = "";
  for (const [v, t] of lista) {
    const b = document.createElement("button");
    b.className = "chip" + (v === activo ? " activo" : ""); b.textContent = t;
    b.onclick = () => aoEscolher(v); c.appendChild(b);
  }
  const a = c.querySelector(".activo"); if (a) a.scrollIntoView({ inline: "center", block: "nearest" });
}

function pintarLogo(el, c) {
  el.textContent = ""; el.style.backgroundImage = ""; el.className = "logo";
  const sem = () => { el.classList.add("sem"); el.textContent = iniciais(c.nome); };
  if (!c.logo) return sem();
  const img = new Image(); img.onload = () => { el.style.backgroundImage = `url("${c.logo}")`; }; img.onerror = sem; img.src = c.logo;
}

function linha(c) {
  const d = document.createElement("div"); d.className = "linha";
  const logo = document.createElement("div"); pintarLogo(logo, c);
  const n = document.createElement("div"); n.className = "nome";
  const b = document.createElement("b"); b.textContent = c.nome;
  const s = document.createElement("small");
  const pr = c.tipo === "tv" ? programas(c) : null;
  s.textContent = pr ? "Agora: " + pr.agora[2] : (c.tipo === "radio" && estado.aba !== "radio" ? nomeGrupo(c.grupo) : "");
  n.append(b, s);
  const f = document.createElement("button"); const e = favoritos.some(x => x.id === c.id);
  f.className = "fav" + (e ? " sim" : ""); f.textContent = e ? "★" : "☆";
  f.onclick = ev => { ev.stopPropagation(); alternarFav(c); };
  d.append(logo, n, f); d.onclick = () => tocar(c);
  return d;
}

async function desenhar() {
  const m = $("#lista"); const q = semAcentos(estado.procura);
  let canais = [];
  try {
    if (estado.aba === "tv") {
      chips(PAISES, estado.pais, p => { estado.pais = p; gravar("pais", p); window.scrollTo(0, 0); desenhar(); });
      canais = await tvDoPais(estado.pais);
    } else if (estado.aba === "radio") {
      const todas = await radios();
      const grupos = ["Todas", ...new Set(todas.map(r => r.grupo))];
      chips(grupos.map(g => [g, g === "Todas" ? "Todas" : nomeGrupo(g)]), estado.regiao, g => { estado.regiao = g; window.scrollTo(0, 0); desenhar(); });
      canais = estado.regiao === "Todas" ? todas : todas.filter(r => r.grupo === estado.regiao);
    } else {
      $("#chips").innerHTML = ""; canais = favoritos;
    }
  } catch (e) {
    m.innerHTML = '<div class="vazio">Não consegui carregar a lista.<br>Confirma a ligação à internet e volta a tentar.</div>'; return;
  }
  if (q) canais = canais.filter(c => semAcentos(c.nome).includes(q));
  const escondidos = estado.aba === "fav" ? [] : canais.filter(c => falhados[c.id]);
  if (!estado.verFalhados) canais = canais.filter(c => !falhados[c.id]);
  estado.listaVisivel = canais;
  m.innerHTML = "";
  if (!canais.length) {
    m.innerHTML = `<div class="vazio">${estado.aba === "fav" ? "Ainda não tens favoritos.<br>Toca na ☆ ao lado de um canal ou rádio." : "Nada encontrado."}</div>`;
    return;
  }
  let ultimo = null; const frag = document.createDocumentFragment();
  for (const c of canais) {
    const g = estado.aba === "tv" ? "" : (c.tipo === "radio" ? nomeGrupo(c.grupo) : "Televisão");
    if (g && g !== ultimo) { const h = document.createElement("div"); h.className = "grupo"; h.textContent = g; frag.appendChild(h); ultimo = g; }
    frag.appendChild(linha(c));
  }
  m.appendChild(frag);
  if (escondidos.length) {
    const b = document.createElement("button"); b.className = "chip"; b.style.margin = "22px auto"; b.style.display = "block";
    b.textContent = estado.verFalhados ? "Esconder os que não abriram" : `Mostrar ${escondidos.length} que não abriram`;
    b.onclick = () => { estado.verFalhados = !estado.verFalhados; desenhar(); };
    m.appendChild(b);
  }
}

function alternarFav(c) {
  const i = favoritos.findIndex(x => x.id === c.id);
  if (i >= 0) favoritos.splice(i, 1);
  else favoritos.push({ id: c.id, nome: c.nome, logo: c.logo, url: c.url, grupo: c.grupo, tipo: c.tipo, cab: c.cab, tid: c.tid, pais: c.pais });
  gravar("favoritos", favoritos); desenhar();
}

// ---------- tocar
const video = $("#video"), audio = $("#audio");

function falhou(c) {
  const site = siteOficial(c);
  if (site) {
    fecharTv();
    avisar(c, "<b></b> só emite para o site do próprio canal.<br>Abre lá o directo, é gratuito.", site, "Abrir site oficial");
    return;
  }
  marcarFalha(c); avisar(c); desenhar();
}
function avisar(c, msg, link, rotulo) {
  $("#avisoTexto").innerHTML = "";
  const t = document.createElement("div"); t.innerHTML = msg || "<b></b> não abriu, por isso escondi-o da lista.<br>Volto a experimentá-lo daqui a 3 dias. Podes tentar já “Abrir à parte”.";
  t.firstChild.textContent = c.nome; $("#avisoTexto").appendChild(t);
  const b = $("#avisoBotoes"); b.innerHTML = "";
  const a = document.createElement("a"); a.textContent = rotulo || "Abrir à parte";
  a.href = link || c.url; a.target = "_blank"; a.rel = "noopener";
  const f = document.createElement("button"); f.textContent = "Fechar"; f.onclick = () => $("#aviso").classList.remove("visivel");
  b.append(a, f); $("#aviso").classList.add("visivel");
}

// Canais que só emitem para o site do próprio canal (SIC, TVI…): o navegador não se pode fazer passar
// pelo site deles, por isso, se não abrirem cá dentro, abre-se a página oficial de directo (gratuita).
const SITES = { "sic.pt": "https://sic.pt/direto" };
function siteOficial(c) {
  if (!c.cab) return "";
  const s = c.cab.r || c.cab.o || "";
  if (!/^https:\/\//.test(s)) return "";
  try { const h = new URL(s).hostname.replace(/^www\./, ""); return SITES[h] || s; } catch (e) { return ""; }
}
function experimentar(el, c, aoFalhar) {
  // o iPhone recusa endereços http dentro de uma página segura: tenta primeiro a versão https
  const tentativas = [...new Set([c.url.replace(/^http:\/\//i, "https://"), c.url])];
  let i = 0, ok = false;
  const proxima = () => {
    if (ok) return;
    if (el._hls) { el._hls.destroy(); el._hls = null; }
    if (i >= tentativas.length) { aoFalhar(); return; }
    const u = tentativas[i++];
    const ehHls = /\.m3u8(\?|$)/i.test(u);
    if (ehHls && !el.canPlayType("application/vnd.apple.mpegurl") && window.Hls && Hls.isSupported()) {
      const h = new Hls({ lowLatencyMode: false }); el._hls = h;
      h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) proxima(); });
      h.loadSource(u); h.attachMedia(el);
      h.on(Hls.Events.MANIFEST_PARSED, () => el.play().catch(() => {}));
    } else {
      el.src = u; el.play().catch(() => {});
    }
  };
  el.onerror = proxima;
  clearTimeout(el._prazo);
  el._prazo = setTimeout(() => { if (!ok && estado.aTocar === c) { i = tentativas.length; proxima(); } }, siteOficial(c) ? 8000 : 20000);
  el.onplaying = () => { ok = true; marcarBom(c); if (el === audio) aTocarRadio(); };
  proxima();
}

function tocar(c) {
  $("#aviso").classList.remove("visivel");
  estado.aTocar = c;
  if (c.tipo === "tv") {
    pararRadio();
    $("#tvNome").textContent = c.nome; $("#tv").classList.add("aberto");
    mostrarGuia(c);
    experimentar(video, c, () => falhou(c));
  } else {
    fecharTv();
    $("#barra").classList.add("visivel");
    $("#barraNome").textContent = c.nome; $("#barraEstado").textContent = "A ligar…";
    pintarLogo($("#barraLogo"), c);
    experimentar(audio, c, () => { $("#barraEstado").textContent = "Sem emissão"; falhou(c); });
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: c.nome, artist: nomeGrupo(c.grupo) || "Rádio",
        artwork: c.logo ? [{ src: c.logo, sizes: "512x512" }] : [] });
      try {
        navigator.mediaSession.setActionHandler("previoustrack", () => zap(-1));
        navigator.mediaSession.setActionHandler("nexttrack", () => zap(1));
      } catch (e) {}
    }
  }
}

function mostrarGuia(c) {
  const el = $("#tvGuia"); el.textContent = "";
  const pr = programas(c); if (!pr) return;
  const a = document.createElement("div"); a.innerHTML = "<b>Agora</b> "; a.append(`${hm(pr.agora[0])}–${hm(pr.agora[1])} · ${pr.agora[2]}`);
  el.appendChild(a);
  if (pr.seguinte) { const b = document.createElement("div"); b.innerHTML = "<b>A seguir</b> "; b.append(`${hm(pr.seguinte[0])} · ${pr.seguinte[2]}`); el.appendChild(b); }
}
setInterval(() => { if (estado.aTocar && estado.aTocar.tipo === "tv" && $("#tv").classList.contains("aberto")) mostrarGuia(estado.aTocar); }, 60000);
function aTocarRadio() { $("#barraEstado").textContent = "Em directo"; $("#tocar").textContent = "⏸"; }
audio.onpause = () => { $("#tocar").textContent = "▶︎"; };
audio.onwaiting = () => { $("#barraEstado").textContent = "A carregar…"; };
$("#tocar").onclick = () => audio.paused ? audio.play().catch(() => {}) : audio.pause();
function pararRadio() { if (audio._hls) { audio._hls.destroy(); audio._hls = null; } audio.onerror = null; audio.pause(); audio.removeAttribute("src"); audio.load(); $("#barra").classList.remove("visivel"); }
$("#parar").onclick = () => { pararRadio(); estado.aTocar = null; };
function fecharTv() { if (video._hls) { video._hls.destroy(); video._hls = null; } video.onerror = null; video.pause(); video.removeAttribute("src"); video.load(); $("#tv").classList.remove("aberto"); }
$("#fecharTv").onclick = () => { fecharTv(); estado.aTocar = null; };

function zap(d) {
  const l = estado.listaVisivel.filter(c => estado.aTocar && c.tipo === estado.aTocar.tipo);
  if (!l.length) return;
  const i = l.findIndex(c => c.id === estado.aTocar.id);
  tocar(l[(i + d + l.length) % l.length]);
}
$("#ant").onclick = () => zap(-1);
$("#seg").onclick = () => zap(1);

document.querySelectorAll(".abas button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".abas button").forEach(x => x.classList.toggle("activa", x === b));
  estado.aba = b.dataset.aba; window.scrollTo(0, 0); desenhar();
});
let espera;
