name: Diagnóstico TVI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright
      - run: |
          U=$(grep -A5 'tvg-id="TVI.pt"' <(curl -s https://raw.githubusercontent.com/jfcarvalho1/tv-portugal/main/listas/tv/portugal.m3u) | grep '^http' | head -1); echo "url: $U"
          curl -s -L -D - -o /tmp/a -H "Origin: https://jfcarvalho1.github.io" "$U" | grep -i -E '^HTTP|^location|access-control|content-type'; head -c 700 /tmp/a; echo
          N=$(grep -v '^#' /tmp/a | grep . | head -1); echo "seguinte: $N"
          case "$N" in http*) curl -s -L -D - -o /tmp/b -H "Origin: https://jfcarvalho1.github.io" "$N" | grep -i -E '^HTTP|^location|access-control'; head -c 500 /tmp/b; echo;; esac
          cat > t.py <<'PY'
          import asyncio, sys
          from playwright.async_api import async_playwright
          async def main(forcar):
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome", args=["--autoplay-policy=no-user-gesture-required"])
                  pg = await b.new_page(viewport={"width": 1000, "height": 700})
                  pg.on("console", lambda m: print("CONSOLA:", m.type, m.text[:300]) if m.type in ("error","warning") else None)
                  pg.on("requestfailed", lambda r: print("FALHOU:", r.url[:200], r.failure))
                  if forcar:
                      await pg.add_init_script("const o=HTMLMediaElement.prototype.canPlayType;HTMLMediaElement.prototype.canPlayType=function(t){return /mpegurl/i.test(t)?'':o.call(this,t)};")
                  await pg.goto("https://jfcarvalho1.github.io/tv-portugal/?v=" + str(forcar))
                  await pg.wait_for_timeout(4000)
                  for nome in ["RTP 1", "SIC", "TVI", "SIC Notícias", "CNN Portugal", "V+ TVI"]:
                      els = pg.locator(".linha"); n = await els.count()
                      for i in range(n):
                          if (await els.nth(i).locator("b").inner_text()).strip() == nome:
                              await els.nth(i).click(); break
                      await pg.wait_for_timeout(15000)
                      st = await pg.evaluate("()=>{const v=document.querySelector('#video');return {src:(v.currentSrc||'').slice(0,100),rs:v.readyState,t:v.currentTime,err:v.error&&v.error.code,hls:!!v._hls,aviso:document.querySelector('#aviso').innerText}}")
                      print("ESTADO", "hls.js" if forcar else "nativo", nome, st)
                      await pg.screenshot(path=f"/tmp/out/{nome.replace(' ','_').replace('+','m')}_{forcar}.png")
                      await pg.evaluate("()=>{document.querySelector('#fecharTv').click();document.querySelector('#aviso').classList.remove('visivel')}")
                  await b.close()
          asyncio.run(main(int(sys.argv[1])))
          PY
          mkdir -p /tmp/out && python3 t.py 0 2>&1 | grep ESTADO
      - run: |
          git init -q d && cd d && git checkout -q -b diagnostico && cp /tmp/out/*.png . 2>/dev/null; git add . && git -c user.name=d -c user.email=d@d commit -qm d && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diagnostico
