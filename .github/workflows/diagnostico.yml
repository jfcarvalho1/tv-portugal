name: Diagnóstico SIC
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright
      - run: |
          cat > t.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome", args=["--autoplay-policy=no-user-gesture-required"])
                  pg = await b.new_page(viewport={"width": 1000, "height": 700})
                  pg.on("console", lambda m: print("CONSOLA:", m.type, m.text[:300]))
                  pg.on("pageerror", lambda e: print("ERRO:", e))
                  pg.on("requestfailed", lambda r: print("FALHOU:", r.url[:150], r.failure))
                  pg.on("response", lambda r: print("RESP:", r.status, r.url[:150]) if ("okast" in r.url or "kaltura" in r.url or "cloudfront" in r.url) and r.status >= 300 else None)
                  await pg.add_init_script("const o=HTMLMediaElement.prototype.canPlayType;HTMLMediaElement.prototype.canPlayType=function(t){return /mpegurl/i.test(t)?'':o.call(this,t)};")
                  await pg.goto("https://jfcarvalho1.github.io/tv-portugal/?v=diag")
                  await pg.wait_for_timeout(4000)
                  for nome in ["SIC", "SIC Notícias", "RTP 1"]:
                      await pg.locator(".linha b", has_text=nome).filter(has_text=nome).first.evaluate("e=>e.closest('.linha').click()") if False else None
                      els = pg.locator(".linha")
                      n = await els.count()
                      for i in range(n):
                          t = (await els.nth(i).locator("b").inner_text()).strip()
                          if t == nome:
                              await els.nth(i).click(); break
                      await pg.wait_for_timeout(15000)
                      st = await pg.evaluate("()=>{const v=document.querySelector('#video');return {src:(v.currentSrc||'').slice(0,120),rs:v.readyState,t:v.currentTime,err:v.error&&v.error.code,hls:!!v._hls,aviso:document.querySelector('#aviso').innerText}}")
                      print("ESTADO", nome, st)
                      await pg.screenshot(path=f"/tmp/out/{nome.replace(' ','_')}.png")
                      await pg.evaluate("()=>{document.querySelector('#fecharTv').click();document.querySelector('#aviso').classList.remove('visivel')}")
                  await b.close()
          asyncio.run(main())
          PY
          mkdir -p /tmp/out && python3 t.py 2>&1 | grep -v 'RESP: 307' | head -150
      - run: |
          git init -q d && cd d && git checkout -q -b diagnostico && cp /tmp/out/*.png . 2>/dev/null; git add . && git -c user.name=d -c user.email=d@d commit -qm d && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diagnostico
