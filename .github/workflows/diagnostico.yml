name: Diagnóstico SIC Notícias
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
      - run: |
          K="https://cdnapisec.kaltura.com/p/4526593/sp/4526593/playManifest/entryId/1_j8ztwihx/deliveryProfileId/672/protocol/https/format/applehttp/a.m3u8"
          F=$(curl -s -L -o /dev/null -w '%{url_effective}' "$K"); echo "final: $F"
          curl -s "$F"; echo
          V=$(dirname "$F")/$(curl -s "$F" | grep -v '^#' | head -1); echo "variante: $V"; curl -s "$V" | head -12
          echo "== CORS"; curl -s -I -H "Origin: https://jfcarvalho1.github.io" "$V" | grep -i -E '^HTTP|access-control|content-type'
          mkdir -p /tmp/out; timeout 60 ffmpeg -loglevel error -y -i "$K" -frames:v 1 -q:v 3 /tmp/out/sicnot.jpg && echo "imagem ok"
          timeout 60 ffprobe -v error -show_entries stream=codec_name,width,height -of compact "$K"
      - run: |
          git init -q d && cd d && git checkout -q -b diagnostico
          cp /tmp/out/sicnot.jpg . 2>/dev/null || echo nada > sem-imagem.txt
          git add . && git -c user.name=diag -c user.email=d@d commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diagnostico
