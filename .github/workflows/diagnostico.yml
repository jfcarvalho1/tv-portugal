name: Diagnóstico SIC directo
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright
      - run: |
          cat > t.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(executable_path="/usr/bin/google-chrome", args=["--autoplay-policy=no-user-gesture-required"])
                  ctx = await b.new_context(locale="pt-PT", timezone_id="Europe/Lisbon", user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36")
                  pg = await ctx.new_page()
                  vistos = set()
                  def req(r):
                      u = r.url
                      if any(k in u for k in (".m3u8", ".mpd", "playManifest", "kaltura", "okast", "license", "widevine", "entryId", "/live", "stream")) and u not in vistos:
                          vistos.add(u); print("PEDIDO:", r.method, u[:400])
                  pg.on("request", req)
                  for url in ("https://sic.pt/direto", "https://opto.sic.pt/direto/sic", "https://opto.sic.pt/"):
                      try:
                          r = await pg.goto(url, wait_until="domcontentloaded", timeout=45000)
                          print("PAGINA:", url, r.status if r else None, await pg.title())
                          await pg.wait_for_timeout(15000)
                          html = await pg.content()
                          import re
                          for m in sorted(set(re.findall(r'(?:entryId|entry_id|partnerId|uiConfId|streamUrl|hls|m3u8)[^<>]{0,160}', html)))[:25]: print("HTML:", m[:200])
                          for f in pg.frames: print("FRAME:", f.url[:200])
                      except Exception as e:
                          print("ERRO", url, e)
                  await b.close()
          asyncio.run(main())
          PY
          python3 t.py 2>&1 | head -120
