name: Diagnóstico SIC
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=$(grep -A4 'tvg-id="SIC.pt"' <(curl -s https://raw.githubusercontent.com/jfcarvalho1/tv-portugal/main/listas/tv/portugal.m3u) | grep '^http' | head -1)
          echo "url: $U"
          echo "== cabeçalhos"; curl -s -D - -o /dev/null "$U" | head -20
          echo "== seguir"; curl -s -L -D - -o /tmp/a -H "Origin: https://jfcarvalho1.github.io" "$U" | grep -i -E '^HTTP|^location|access-control'; head -c 500 /tmp/a; echo
          F=$(curl -s -L -o /dev/null -w '%{url_effective}' "$U"); echo "final: $F"
          V=$(grep -v '^#' /tmp/a | head -1); case "$V" in http*) ;; *) V=$(dirname "$F")/$V;; esac; echo "seguinte: $V"
          curl -s -L -D - -o /tmp/v -H "Origin: https://jfcarvalho1.github.io" "$V" | grep -i -E '^HTTP|^location|access-control'; head -c 300 /tmp/v; echo
