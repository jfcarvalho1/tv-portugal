name: Rádios TuneIn (só recolha)
on:
  workflow_dispatch:
concurrency:
  group: actualizar
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  tunein:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 radios_tunein.py .
      - run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add listas/radios-tunein.json listas/radios-tunein-relatorio.txt
          git diff --cached --quiet || git commit -m "Rádios TuneIn $(date -u +%F)"
          git pull --rebase -X theirs origin main || true
          git push
