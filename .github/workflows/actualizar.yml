name: Actualizar listas
on:
  schedule:
    - cron: "17 5 * * *"   # todos os dias às 05:17 UTC
  workflow_dispatch:        # botão "Run workflow" para actualizar à mão
permissions:
  contents: write
concurrency:
  group: actualizar-listas  # nunca correm duas actualizações ao mesmo tempo
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar listas
        run: python3 actualizar.py .
      - name: Guardar no repositório
        run: |
          git config user.name "actualizador"
          git config user.email "actions@users.noreply.github.com"
          cp -r listas /tmp/listas-novas
          for tentativa in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf listas && cp -r /tmp/listas-novas listas
            git add listas
            git diff --cached --quiet && exit 0
            git commit -m "Listas actualizadas $(date -u +%F)"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
